<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃園機場 B類駕駛許可證 題庫複習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #2d3748;
    --accent: #f97316;
    --accent2: #fb923c;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-mid: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

  header { text-align: center; padding: 40px 0 30px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.3);
    border-radius: 20px; padding: 6px 16px; font-size: 12px; color: var(--accent2);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
  h1 { font-size: clamp(22px,4vw,36px); font-weight: 900; letter-spacing: -0.5px; line-height: 1.2; color: #fff; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text-mid); margin-top: 8px; font-size: 14px; }

  .mode-bar { display: flex; gap: 8px; margin: 24px 0 20px; flex-wrap: wrap; justify-content: center; }
  .mode-btn { padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-mid); cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 500; transition: all .2s; }
  .mode-btn:hover { border-color: var(--accent); color: var(--text); }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  .stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: var(--accent2); }
  .stat-val.green { color: var(--green); }
  .stat-val.red { color: var(--red); }
  .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  .progress-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
  .progress-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 3px; transition: width .5s ease; }

  .runway-deco { height: 3px; background: repeating-linear-gradient(90deg, var(--accent) 0, var(--accent) 20px, transparent 20px, transparent 40px); margin: 20px 0; border-radius: 2px; opacity: 0.4; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 16px; animation: slideIn .3s ease; }
  @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .q-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.2); padding: 3px 10px; border-radius: 6px; }
  .q-type { font-size: 11px; color: var(--text-dim); background: var(--surface2); padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .q-keyword { margin-left: auto; font-size: 11px; color: var(--yellow); background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.2); padding: 3px 10px; border-radius: 6px; }

  .q-text { font-size: 16px; font-weight: 500; line-height: 1.7; color: #fff; margin-bottom: 20px; }

  /* Image area for picture questions */
  .q-image { margin-bottom: 18px; display: flex; justify-content: center; }
  .q-image-inner { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 24px; display: flex; align-items: center; justify-content: center; min-height: 80px; }

  /* CSS-drawn signs */
  .sign-red { background: #dc2626; color: #fff; font-weight: 900; font-family: 'JetBrains Mono', monospace; padding: 8px 18px; font-size: 18px; border: 3px solid #fff; outline: 3px solid #dc2626; letter-spacing: 1px; }
  .sign-black-yellow { background: #1a1a1a; color: #f59e0b; font-weight: 900; font-family: 'JetBrains Mono', monospace; padding: 8px 18px; font-size: 18px; border: 2px solid #f59e0b; letter-spacing: 1px; }
  .sign-yellow-black { background: #f59e0b; color: #1a1a1a; font-weight: 900; font-family: 'JetBrains Mono', monospace; padding: 8px 18px; font-size: 18px; border: 2px solid #1a1a1a; letter-spacing: 1px; }
  .sign-combo { display: flex; gap: 0; }
  .sign-stop { background: #dc2626; color: #fff; font-weight: 900; font-family: 'Noto Sans TC', sans-serif; padding: 10px 16px; font-size: 14px; border-radius: 50%; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; flex-direction: column; border: 3px solid #fff; }
  .sign-slow { background: #f59e0b; color: #1a1a1a; font-weight: 900; font-family: 'Noto Sans TC', sans-serif; padding: 10px 16px; font-size: 14px; border-radius: 50%; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 3px solid #1a1a1a; }

  /* Line markings */
  .marking-wrap { display: flex; flex-direction: column; gap: 4px; width: 120px; }
  .mark-line { height: 6px; border-radius: 2px; }
  .mark-solid { background: #f59e0b; }
  .mark-dashed { background: repeating-linear-gradient(90deg, #f59e0b 0, #f59e0b 12px, transparent 12px, transparent 20px); }
  .mark-white-solid { background: #fff; }
  .mark-red-hatch { background: repeating-linear-gradient(45deg, #dc2626 0, #dc2626 6px, transparent 6px, transparent 12px); height: 50px; width: 80px; border: 2px solid #dc2626; }
  .mark-yellow-hatch { background: repeating-linear-gradient(45deg, #f59e0b 0, #f59e0b 6px, transparent 6px, transparent 12px); height: 50px; width: 80px; border: 2px solid #f59e0b; }
  .mark-grey-hatch { background: repeating-linear-gradient(45deg, #94a3b8 0, #94a3b8 6px, transparent 6px, transparent 12px); height: 50px; width: 80px; border: 2px solid #94a3b8; }
  .mark-blue-box { width: 80px; height: 50px; border: 3px solid #60a5fa; background: rgba(96,165,250,0.08); display: flex; align-items: center; justify-content: center; }
  .mark-parking-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #fff; background: var(--surface2); border: 2px solid #94a3b8; padding: 6px 10px; text-align: center; }
  .mark-black-white { background: repeating-linear-gradient(90deg, #000 0, #000 10px, #fff 10px, #fff 20px); height: 8px; width: 120px; border: 1px solid #666; }
  .mark-tow-zone { position: relative; width: 100px; height: 60px; border: 2px solid #3b82f6; background: rgba(59,130,246,0.08); }
  .mark-tow-zone::after { content: '←EH1'; position: absolute; top: 2px; right: 2px; font-size: 10px; color: #60a5fa; font-family: 'JetBrains Mono', monospace; }

  /* Apron diagram */
  .apron-diagram { width: 140px; height: 90px; background: #1e293b; border: 2px solid #475569; border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
  .apron-inner { background: rgba(34,197,94,.15); border: 2px solid #22c55e; width: 60px; height: 40px; position: absolute; left: 40px; top: 20px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #22c55e; }
  .apron-circle { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #f59e0b; position: absolute; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; transition: all .2s; text-align: left; width: 100%; color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 14px; line-height: 1.5; }
  .option:hover:not(:disabled) { border-color: var(--accent); background: rgba(249,115,22,.08); }
  .option-letter { min-width: 28px; height: 28px; border-radius: 6px; background: #0d1117; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
  .option.correct { border-color: var(--green); background: rgba(34,197,94,.1); }
  .option.correct .option-letter { background: var(--green); color: #fff; border-color: var(--green); }
  .option.wrong { border-color: var(--red); background: rgba(239,68,68,.1); }
  .option.wrong .option-letter { background: var(--red); color: #fff; border-color: var(--red); }
  .option:disabled { cursor: default; }

  .tf-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tf-opt { padding: 20px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; text-align: center; font-size: 28px; font-weight: 900; transition: all .2s; color: var(--text-mid); font-family: 'JetBrains Mono', monospace; }
  .tf-opt:hover:not(:disabled) { transform: scale(1.02); }
  .tf-opt.tf-true:hover:not(:disabled) { border-color: var(--green); color: var(--green); background: rgba(34,197,94,.08); }
  .tf-opt.tf-false:hover:not(:disabled) { border-color: var(--red); color: var(--red); background: rgba(239,68,68,.08); }
  .tf-opt.correct { border-color: var(--green); color: var(--green); background: rgba(34,197,94,.1); }
  .tf-opt.wrong { border-color: var(--red); color: var(--red); background: rgba(239,68,68,.1); }
  .tf-opt:disabled { cursor: default; }
  .tf-sub { font-size: 12px; font-weight: 400; font-family: 'Noto Sans TC', sans-serif; margin-top: 4px; }

  .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 14px; line-height: 1.6; display: none; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
  .feedback.wrong-fb { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .feedback-icon { font-size: 18px; margin-right: 8px; }

  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 700; transition: all .2s; display: flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--accent); color: #fff; flex: 1; }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); color: var(--text-mid); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--text); }

  .result-screen { display: none; text-align: center; padding: 40px 20px; }
  .result-screen.show { display: block; }
  .result-score { font-size: 80px; font-weight: 900; font-family: 'JetBrains Mono', monospace; line-height: 1; margin: 20px 0; }
  .result-grade { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .result-msg { color: var(--text-mid); font-size: 14px; margin-bottom: 30px; }

  @media(max-width:600px){
    .stats-bar{grid-template-columns:repeat(2,1fr)}
    .card{padding:18px}
    .q-keyword{display:none}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">TAOYUAN INTL AIRPORT · TPE/RCTP</div>
    <h1>B類<span>駕駛許可證</span><br>題庫複習系統</h1>

  <div class="mode-bar">

    <div class="stat"><div class="stat-val red" id="stat-wrong">0</div><div class="stat-label">答錯</div></div>
  </div>

  <div class="progress-wrap">
    <span class="progress-label" id="prog-label">0 / 0</span>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="progress-label" id="prog-pct">0%</span>

  <div class="runway-deco"></div>
  <div id="quiz-area"></div>
  <div class="result-screen" id="result-screen">

    <div class="result-grade" id="result-grade"></div>
    <div class="result-msg" id="result-msg"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="restartQuiz()">🔄 重新練習</button>
      <button class="btn btn-secondary" onclick="setMode('wrong')">❌ 複習錯題</button>
    </div>
  </div>
</div>

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b,i) => {
    const modes = ['all','single','truefalse','picture','random','mock40','wrong'];
    b.classList.toggle('active', modes[i] === m);
  });
  restartQuiz();
}

function buildPool() {
  let base = [...QUESTIONS];
  if (mode === 'single') base = base.filter(q=>q.type==='single');
  else if (mode === 'truefalse') base = base.filter(q=>q.type==='tf');
  else if (mode === 'picture') base = base.filter(q=>q.type==='picture');
  else if (mode === 'mock40') {
    const singles = QUESTIONS.filter(q=>q.type==='single').sort(()=>Math.random()-.5).slice(0,14);
    const tfs = QUESTIONS.filter(q=>q.type==='tf').sort(()=>Math.random()-.5).slice(0,22);
    const pics = QUESTIONS.filter(q=>q.type==='picture').sort(()=>Math.random()-.5).slice(0,4);
    base = [...singles, ...tfs, ...pics].sort(()=>Math.random()-.5);
  }
  else if (mode === 'wrong') {
    base = base.filter(q=>wrongIds.has(q.id));
    if (!base.length) { alert('目前沒有錯題！請先作答後再複習。'); return false; }
  }
  if (mode === 'random') base = base.sort(()=>Math.random()-0.5);
  return base;
}

function restartQuiz() {
  const p = buildPool();
  if (!p) return;
  pool = p; current = 0; answered = false;
  correctCount = 0; wrongCount = 0; sessionAnswered = new Set();
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  updateStats(); renderQuestion();
}

function renderQuestion() {
  if (current >= pool.length) { showResult(); return; }
  const q = pool[current];
  answered = false;
  updateStats();
  const area = document.getElementById('quiz-area');
  const typeLabel = q.type === 'single' ? '單選題' : q.type === 'tf' ? '是非題' : '圖示題';

  let imgHTML = q.img ? `<div class="q-image">${IMG[q.img]}</div>` : '';

  let optHTML = '';
  if (q.type === 'tf') {
    optHTML = `<div class="tf-options">
      <button class="tf-opt tf-true" onclick="answerTF(true)" id="tf-true">○<div class="tf-sub">正確</div></button>
      <button class="tf-opt tf-false" onclick="answerTF(false)" id="tf-false">✕<div class="tf-sub">錯誤</div></button>
    </div>`;
  } else {
    const indices = q.opts.map((_,i)=>i).sort(()=>Math.random()-.5);
    shuffledOpts = indices;
    optHTML = `<div class="options">` +
      indices.map((origIdx, displayPos) => `
        <button class="option" onclick="answer(${displayPos})" id="opt-${displayPos}">
          <span class="option-letter">${LABELS[displayPos]}</span>
          <span>${q.opts[origIdx]}</span>
        </button>`).join('') + `</div>`;
  }

  area.innerHTML = `
    <div class="card">
      <div class="q-meta">
        <span class="q-num">Q${current+1}</span>
        <span class="q-type">${typeLabel}</span>
        <span class="q-keyword"># ${q.kw}</span>
      </div>
      ${imgHTML}
      <div class="q-text">${q.q}</div>
      ${optHTML}
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="actions" id="actions">
      <button class="btn btn-secondary" onclick="skipQuestion()">跳過</button>
    </div>`;
}

function answer(displayPos) {
  if (answered) return;
  answered = true;
  const q = pool[current];
  const originalIdx = shuffledOpts[displayPos];
  const correct = originalIdx === q.ans;
  const correctDisplayPos = shuffledOpts.indexOf(q.ans);
  sessionAnswered.add(q.id);
  if (correct) { correctCount++; wrongIds.delete(q.id); }
  else { wrongCount++; wrongIds.add(q.id); }
  shuffledOpts.forEach((_,i) => {
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
    if (i === correctDisplayPos) btn.classList.add('correct');
    else if (i === displayPos) btn.classList.add('wrong');
  });
  showFeedback(correct, correct ? '' : `正確答案：${LABELS[correctDisplayPos]}. ${q.opts[q.ans]}`);
  updateActions();
}

function answerTF(val) {
  if (answered) return;
  answered = true;
  const q = pool[current];
  const correct = val === q.ans;
  sessionAnswered.add(q.id);
  if (correct) { correctCount++; wrongIds.delete(q.id); }
  else { wrongCount++; wrongIds.add(q.id); }
  document.getElementById('tf-true').disabled = true;
  document.getElementById('tf-false').disabled = true;
  if (q.ans === true) {
    document.getElementById('tf-true').classList.add('correct');
    if (!correct) document.getElementById('tf-false').classList.add('wrong');
  } else {
    document.getElementById('tf-false').classList.add('correct');
    if (!correct) document.getElementById('tf-true').classList.add('wrong');
  }
  showFeedback(correct, `正確答案：${q.ans ? '○ 正確' : '✕ 錯誤'}`);
  updateActions();
}

function showFeedback(correct, hint) {
  const fb = document.getElementById('feedback');
  fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
  fb.innerHTML = `<span class="feedback-icon">${correct ? '✅' : '❌'}</span>${correct ? '答對了！' : '答錯了。'} ${hint}`;
}

function updateActions() {
  document.getElementById('actions').innerHTML = `
    <button class="btn btn-primary" onclick="nextQuestion()">下一題 →</button>
    <button class="btn btn-secondary" onclick="skipQuestion()">跳過</button>`;
}

function nextQuestion() { current++; renderQuestion(); }
function skipQuestion() { current++; if (current >= pool.length) showResult(); else renderQuestion(); }

function updateStats() {
  document.getElementById('stat-total').textContent = pool.length || 0;
  document.getElementById('stat-done').textContent = sessionAnswered.size;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  const pct = pool.length ? Math.round(sessionAnswered.size/pool.length*100) : 0;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `${current} / ${pool.length}`;
  document.getElementById('prog-pct').textContent = pct+'%';
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-screen').classList.add('show');
  const total = sessionAnswered.size;
  const pct = total ? Math.round(correctCount/total*100) : 0;
  let grade, color, msg;
  if (pct>=90){grade='優秀 🏆';color='#22c55e';msg='表現卓越！準備好考試了！';}
  else if(pct>=80){grade='良好 👍';color='#f97316';msg='相當不錯，再複習弱點即可。';}
  else if(pct>=60){grade='尚可 📚';color='#f59e0b';msg='還需要加強，多複習錯題。';}
  else{grade='需加強 💪';color='#ef4444';msg='請重新仔細複習題庫。';}
  document.getElementById('result-score').textContent = pct+'%';
  document.getElementById('result-score').style.color = color;
  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-msg').textContent = `作答 ${total} 題，答對 ${correctCount} 題，答錯 ${wrongCount} 題。${msg}`;
}

restartQuiz();
</script>
